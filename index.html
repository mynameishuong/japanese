<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Luyện thi Hiragana và Katakana A–RO, kèm phát âm, từ vựng và câu ví dụ.">
<meta name="theme-color" content="#f5f7fb">
<title>Bài thi Hiragana & Katakana A–RO + Phát âm</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:#111827;font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:920px;margin:30px auto;padding:16px}
.card{background:#fff;border-radius:18px;padding:28px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
h1{text-align:center;margin:0 0 8px}
.sub{text-align:center;color:#6b7280;margin-bottom:20px}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:22px}
.modebtn{border:1px solid #cbd5e1;background:#fff;color:#111827;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:700}
.modebtn.active{background:#e0ecff;border-color:#2563eb;color:#1d4ed8}
.topbar{display:flex;justify-content:space-between;gap:12px;font-weight:700;font-size:18px;margin-bottom:18px}
.progress{height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-bottom:28px}
#bar{height:100%;background:#2563eb;width:0;transition:.2s}
.question{text-align:center;font-size:25px;line-height:1.4;margin-bottom:24px}
.kana-big{display:block;width:125px;height:125px;object-fit:contain;margin:14px auto 0;border-radius:8px}.kana-big-text{display:block;font-size:100px;line-height:1.3;font-weight:700;margin:10px auto}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.option{min-height:112px;border:2px solid #cbd5e1;background:#fff;border-radius:16px;cursor:pointer;font-size:28px;display:flex;align-items:center;justify-content:center;padding:10px;color:#111827}
.option:hover:not(:disabled){border-color:#2563eb;background:#eff6ff}
.option:disabled{opacity:1;cursor:default}
.option.correct{background:#dcfce7;border-color:#16a34a}
.option.wrong{background:#fee2e2;border-color:#dc2626}
.kana-option{width:84px;height:84px;object-fit:contain;border-radius:6px}
.feedback{min-height:35px;text-align:center;font-size:18px;font-weight:700;margin-top:20px}
.ok{color:#15803d} .bad{color:#b91c1c}
.learnbox{display:none;margin-top:20px;border:1px solid #dbe3ef;background:#f8fafc;border-radius:16px;padding:18px}
.learn-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.learn-kana-wrap{display:flex;align-items:center;gap:12px}
.learn-kana{width:62px;height:62px;object-fit:contain}.learn-kana-text{display:none;width:62px;height:62px;line-height:62px;text-align:center;font-size:52px;font-weight:700}
.learn-romaji{font-size:28px;font-weight:800}
.speakbtn{border:0;border-radius:12px;background:#0f766e;color:#fff;padding:11px 14px;cursor:pointer;font-weight:700}
.speakbtn.secondary{background:#334155}
.learn-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.learn-card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:14px;text-align:left}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#64748b;font-weight:800;margin-bottom:6px}
.jp{font-size:28px;font-weight:700;margin-bottom:4px}
.roma{color:#475569;margin-bottom:4px}
.meaning{color:#111827}
.audio-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.next,.restart{display:block;margin:20px auto 0;border:0;border-radius:12px;padding:14px 26px;background:#111827;color:#fff;font-size:17px;cursor:pointer}
.next{display:none}
.result{display:none;text-align:center}
.scoreBig{font-size:58px;font-weight:800;margin:12px 0}
.review{text-align:left;margin-top:24px}
.review-item{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid #e5e7eb}
.review-kana{width:42px;height:42px;object-fit:contain}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:13px;font-weight:700}
.note{font-size:13px;color:#64748b;text-align:center;margin-top:10px}
@media(max-width:650px){
  .wrap{margin:8px auto;padding:8px} .card{padding:20px 12px}
  .options{grid-template-columns:1fr 1fr;gap:10px}
  .option{min-height:92px} .kana-option{width:68px;height:68px}
  .question{font-size:21px} .learn-grid{grid-template-columns:1fr}
}

/* Mobile-friendly refinements */
button, .option { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button { font: inherit; }
@media (max-width: 650px) {
  body { min-width: 320px; }
  .wrap { margin: 0 auto; padding: 8px; }
  .card { padding: 18px 12px; border-radius: 14px; }
  h1 { font-size: clamp(22px, 6vw, 30px); line-height: 1.2; }
  .sub { font-size: 14px; line-height: 1.45; margin-bottom: 16px; }
  .controls { gap: 8px; margin-bottom: 18px; }
  .modebtn { min-height: 42px; padding: 9px 11px; font-size: 14px; }
  .topbar { font-size: 15px; margin-bottom: 12px; }
  .progress { margin-bottom: 20px; }
  .question { font-size: 20px; margin-bottom: 18px; }
  .kana-big { max-width: 34vw; max-height: 34vw; }
  .kana-big-text { font-size: clamp(72px, 22vw, 100px); }
  .options { gap: 9px; }
  .option { min-height: 84px; border-radius: 12px; padding: 8px; font-size: 24px; }
  .kana-option { width: min(68px, 18vw); height: min(68px, 18vw); }
  .feedback { font-size: 16px; }
  .learnbox { padding: 12px; }
  .learn-kana { width: 54px; height: 54px; }
  .learn-kana-text { width: 54px; height: 54px; line-height: 54px; font-size: 46px; }
  .learn-romaji { font-size: 24px; }
  .learn-card { padding: 12px; }
  .jp { font-size: 25px; }
  .next, .restart { width: 100%; min-height: 48px; padding: 13px 16px; }
  .scoreBig { font-size: 48px; }
  .review-item { padding: 10px 4px; }
}
@media (max-width: 380px) {
  .card { padding: 15px 9px; }
  .modebtn { padding: 8px 9px; font-size: 13px; }
  .option { min-height: 76px; font-size: 22px; }
}

</style>
</head>
<body>
<div class="wrap"><div class="card">
<div id="quiz">
  <h1 id="pageTitle">Bài thi Hiragana A–RO</h1>
  <div class="sub" id="pageSub">43 chữ • có phát âm + từ vựng + cụm từ ví dụ sau mỗi câu</div>

  <div class="controls">
    <button class="modebtn active" id="hiraganaBtn" type="button">Hiragana</button>
    <button class="modebtn" id="katakanaBtn" type="button">Katakana</button>
    <button class="modebtn active" id="allBtn" type="button">Thi toàn bộ 43 chữ</button>
    <button class="modebtn" id="newBtn" type="button">Chỉ ôn 13 chữ mới</button>
  </div>

  <div class="topbar"><div id="counter"></div><div id="score">Điểm: 0</div></div>
  <div class="progress"><div id="bar"></div></div>
  <div class="question" id="question"></div>
  <div class="options" id="options"></div>
  <div class="feedback" id="feedback"></div>

  <div class="learnbox" id="learnbox">
    <div class="learn-head">
      <div class="learn-kana-wrap">
        <img id="learnKana" class="learn-kana" alt=""><span id="learnKanaText" class="learn-kana-text"></span>
        <div>
          <div id="learnRomaji" class="learn-romaji"></div>
          <div id="learnHint" class="meaning"></div>
        </div>
      </div>
      <button class="speakbtn" id="speakKana" type="button">🔊 Phát âm chữ</button>
    </div>

    <div class="learn-grid">
      <div class="learn-card">
        <div class="label">Từ vựng liên quan</div>
        <div class="jp" id="word"></div>
        <div class="roma" id="wordRomaji"></div>
        <div class="meaning" id="wordMeaning"></div>
        <div class="audio-row">
          <button class="speakbtn secondary" id="speakWord" type="button">🔊 Nghe từ</button>
        </div>
      </div>

      <div class="learn-card">
        <div class="label">Cụm từ ví dụ</div>
        <div class="jp" id="phrase"></div>
        <div class="roma" id="phraseRomaji"></div>
        <div class="meaning" id="phraseMeaning"></div>
        <div class="audio-row">
          <button class="speakbtn secondary" id="speakPhrase" type="button">🔊 Nghe cụm từ</button>
        </div>
      </div>
    </div>
    <div class="note">Âm thanh dùng giọng tiếng Nhật có sẵn trong trình duyệt/hệ điều hành.</div>
  </div>

  <button class="next" id="nextBtn" type="button">Câu tiếp theo</button>
</div>

<div class="result" id="result">
  <h1>Kết quả</h1>
  <div class="scoreBig" id="finalScore"></div>
  <div id="message"></div>
  <div class="review" id="review"></div>
  <button class="restart" id="restartBtn" type="button">Làm lại</button>
</div>
</div></div>

const newRomaji = new Set(["ma","mi","mu","me","mo","ya","yu","yo","ra","ri","ru","re","ro"]);
let mode="all", scriptType="hiragana", questions=[], index=0, score=0, answered=false, mistakes=[], currentItem=null;
function katakanaOf(text){return [...text].map(ch=>ch>="ぁ"&&ch<="ゖ"?String.fromCharCode(ch.charCodeAt(0)+0x60):ch).join("");}
function shownKana(item){return scriptType==="katakana"?katakanaOf(item.kana):item.kana;}
function shownWord(text){return scriptType==="katakana"?katakanaOf(text):text;}

function shuffle(a){
  a=[...a];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function buildOptions(correct){
  return shuffle([correct,...shuffle(kana.filter(x=>x.romaji!==correct.romaji)).slice(0,3)]);
}
function buildQuestions(){
  const source=mode==="new"?kana.filter(x=>newRomaji.has(x.romaji)):kana;
  return shuffle(source).map(item=>({
    item,
    type:Math.random()<.5?"kanaToRomaji":"romajiToKana",
    options:buildOptions(item)
  }));
}
function startQuiz(){
  questions=buildQuestions(); index=0; score=0; answered=false; mistakes=[]; currentItem=null;
  document.getElementById("quiz").style.display="block";
  document.getElementById("result").style.display="none";
  showQuestion();
}
function showQuestion(){
  answered=false;
  const q=questions[index], total=questions.length;
  currentItem=q.item;
  document.getElementById("counter").textContent=`Câu ${index+1}/${total}`;
  document.getElementById("score").textContent=`Điểm: ${score}`;
  document.getElementById("bar").style.width=`${index/total*100}%`;
  document.getElementById("feedback").innerHTML="";
  document.getElementById("learnbox").style.display="none";
  document.getElementById("nextBtn").style.display="none";

  const question=document.getElementById("question");
  if(q.type==="kanaToRomaji"){
    question.innerHTML=scriptType==="katakana"
      ? `Chữ Katakana này đọc là gì?<span class="kana-big-text">${shownKana(q.item)}</span>`
      : `Chữ Hiragana này đọc là gì?<img class="kana-big" src="${q.item.img}" alt="${q.item.romaji}">`;
  } else {
    question.innerHTML=`Romaji <b>${q.item.romaji}</b> tương ứng với chữ nào?`;
  }

  const options=document.getElementById("options");
  options.innerHTML="";
  q.options.forEach(opt=>{
    const b=document.createElement("button");
    b.className="option"; b.type="button"; b.dataset.romaji=opt.romaji;
    if(q.type==="kanaToRomaji") b.textContent=opt.romaji;
    else if(scriptType==="katakana") { b.textContent=shownKana(opt); b.style.fontSize="58px"; }
    else {
      const im=document.createElement("img");
      im.src=opt.img; im.alt=opt.romaji; im.className="kana-option";
      b.appendChild(im);
    }
    b.addEventListener("click",()=>chooseAnswer(b,opt));
    options.appendChild(b);
  });
}
function showLearning(item){
  const learnImg=document.getElementById("learnKana"), learnText=document.getElementById("learnKanaText");
  if(scriptType==="katakana"){learnImg.style.display="none";learnText.style.display="inline-block";learnText.textContent=shownKana(item);}
  else {learnImg.style.display="inline-block";learnText.style.display="none";learnImg.src=item.img;learnImg.alt=item.romaji;}
  document.getElementById("learnRomaji").textContent=item.romaji;
  document.getElementById("learnHint").textContent=`${scriptType==="katakana"?"Katakana":"Hiragana"}: ${shownKana(item)}`;

  document.getElementById("word").textContent=item.word;
  document.getElementById("wordRomaji").textContent=item.wordRomaji;
  document.getElementById("wordMeaning").textContent=item.meaning;

  document.getElementById("phrase").textContent=item.phrase;
  document.getElementById("phraseRomaji").textContent=item.phraseRomaji;
  document.getElementById("phraseMeaning").textContent=item.phraseMeaning;

  document.getElementById("learnbox").style.display="block";
}
function speak(text){
  if(!("speechSynthesis" in window)){
    alert("Trình duyệt này không hỗ trợ phát âm tự động.");
    return;
  }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="ja-JP";
  u.rate=0.82;
  u.pitch=1.0;

  const voices=speechSynthesis.getVoices();
  const ja=voices.find(v => (v.lang||"").toLowerCase().startsWith("ja"));
  if(ja) u.voice=ja;
  speechSynthesis.speak(u);
}
function chooseAnswer(btn,selected){
  if(answered)return;
  answered=true;
  const q=questions[index];
  const buttons=[...document.querySelectorAll(".option")];

  buttons.forEach(b=>{ if(b.dataset.romaji===q.item.romaji)b.classList.add("correct"); });
  if(selected.romaji===q.item.romaji){
    score++;
    document.getElementById("feedback").innerHTML='<span class="ok">✓ Chính xác!</span>';
  } else {
    btn.classList.add("wrong");
    document.getElementById("feedback").innerHTML=
      `<span class="bad">✗ Sai. Đáp án đúng: ${q.item.romaji}</span>`;
    mistakes.push({item:q.item,selected});
  }
  buttons.forEach(b=>b.disabled=true);
  document.getElementById("score").textContent=`Điểm: ${score}`;
  showLearning(q.item);
  document.getElementById("nextBtn").style.display="block";
}

document.getElementById("speakKana").addEventListener("click",()=>currentItem&&speak(currentItem.kana));
document.getElementById("speakWord").addEventListener("click",()=>currentItem&&speak(currentItem.word));
document.getElementById("speakPhrase").addEventListener("click",()=>currentItem&&speak(currentItem.phrase));

document.getElementById("nextBtn").addEventListener("click",()=>{
  speechSynthesis && speechSynthesis.cancel();
  index++;
  if(index<questions.length)showQuestion(); else finishQuiz();
});
function finishQuiz(){
  const total=questions.length;
  document.getElementById("quiz").style.display="none";
  document.getElementById("result").style.display="block";
  document.getElementById("finalScore").textContent=`${score}/${total}`;
  const p=Math.round(score/total*100);
  document.getElementById("message").textContent=
    p>=90?`Rất tốt! ${p}% — Nhớ khá chắc rồi.`:
    p>=75?`Khá tốt! ${p}% — Ôn lại các chữ sai.`:
    `${p}% — Nên ôn lại rồi làm thêm một vòng.`;

  const review=document.getElementById("review");
  review.innerHTML="";
  if(!mistakes.length){
    review.innerHTML='<h3 class="ok">Không sai câu nào 🎉</h3>'; return;
  }
  const h=document.createElement("h3"); h.textContent="Các chữ cần ôn lại:"; review.appendChild(h);
  mistakes.forEach(m=>{
    const d=document.createElement("div"); d.className="review-item";
    d.innerHTML=`${scriptType==="katakana"?`<span style="font-size:32px;font-weight:700">${shownKana(m.item)}</span>`:`<img class="review-kana" src="${m.item.img}" alt="${m.item.romaji}">`}
      <b>${m.item.romaji}</b>
      ${newRomaji.has(m.item.romaji)?'<span class="badge">chữ mới</span>':''}
      — từ gợi nhớ: <b>${m.item.word}</b> (${m.item.meaning})`;
    review.appendChild(d);
  });
}
function setScript(nextScript){
  scriptType=nextScript;
  document.getElementById("hiraganaBtn").classList.toggle("active",scriptType==="hiragana");
  document.getElementById("katakanaBtn").classList.toggle("active",scriptType==="katakana");
  document.getElementById("pageTitle").textContent=`Bài thi ${scriptType==="katakana"?"Katakana":"Hiragana"} A–RO`;
  document.getElementById("pageSub").textContent=`43 chữ • có phát âm + từ vựng + cụm từ ví dụ sau mỗi câu`;
  document.getElementById("newBtn").style.display=scriptType==="katakana"?"none":"inline-block";
  document.getElementById("allBtn").textContent=scriptType==="katakana"?"Thi toàn bộ 43 chữ Katakana":"Thi toàn bộ 43 chữ";
  startQuiz();
}
document.getElementById("hiraganaBtn").addEventListener("click",()=>setScript("hiragana"));
document.getElementById("katakanaBtn").addEventListener("click",()=>setScript("katakana"));
function setMode(nextMode){
  mode=nextMode;
  document.getElementById("allBtn").classList.toggle("active",mode==="all");
  document.getElementById("newBtn").classList.toggle("active",mode==="new");
  startQuiz();
}
document.getElementById("allBtn").addEventListener("click",()=>setMode("all"));
document.getElementById("newBtn").addEventListener("click",()=>setMode("new"));
document.getElementById("restartBtn").addEventListener("click",startQuiz);

startQuiz();
</script>
